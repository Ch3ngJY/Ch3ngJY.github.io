comment_disqus:
    enable: false
    url:  # the url of your website main domain like this https://xxx.xxx/
    name: # the short name in disqus

# documents: https://giscus.app/
comment_giscus:
  enable: true
  repo: Ch3ngJY/Ch3ngJY.github.io
  repo_id: R_kgDOP_vA2A
  category: Announcements
  category_id: DIC_kwDOP_vA2M4DA5vp
  mapping: pathname
  strict: 0
  reactions_enabled: 1
  emit_metadata: 0
  input_position: bottom
  lang: zh-CN
  loading: lazy
  theme_light: light_protanopia
  theme_dark: dark_protanopia

# dark
# light
# user-can-set
appearance: auto # Default value is auto

# Post cover image pool.
# Put local images under source/images/covers/ or use stable CDN URLs.
# Direct Pixiv hotlinking is not recommended because it is often blocked.
post_cover:
  random: true
  random_covers:
    - /images/covers/1.jpg
    - /images/covers/2.jpg
    - /images/covers/3.jpg
    - /images/covers/4.jpg

# Similar to Butterfly's canvas-nest background effect.
background_effect:
  canvas_nest:
    enable: true
    count: 99
    mobile: false
    max_distance: 6000
    mouse_distance: 20000

# Miscellaneous
favicon: images/favicon.ico

